    <main class="container">
        <h2 class="page-title">Student Admission Form</h2>
        <div class="title-underline"></div>

        <div class="form-card">
            <form action="Untitled-1.html" method="post">
                <div class="form-grid">
                    
                    <div class="form-group">
                        <label>Full Name <span>*</span></label>
                        <input type="text" name="fullname" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth <span>*</span></label>
                        <input type="date" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label>Email <span>*</span></label>
                        <input type="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label>Course Applied For <span>*</span></label>
                        <select name="course" required>
                            <option value="">-- Select Course --</option>
                            <option value="CSE">B.Tech - Computer Science &amp; Engineering</option>
                            <option value="ECE">B.Tech - Electronics &amp; Comm. Engineering</option>
                            <option value="ME">B.Tech - Mechanical Engineering</option>
                            <option value="CE">B.Tech - Civil Engineering</option>
                            <option value="EE">B.Tech - Electrical Engineering</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Mobile Number <span>*</span></label>
                        <input type="tel" name="mobile" placeholder="Enter mobile number" required>
                    </div>

                    <div class="form-group">
                        <label>Address <span>*</span></label>
                        <input type="text" name="address" placeholder="Enter your address" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Gender <span>*</span></label>
                        <div class="radio-group">
                            <label><input type="radio" name="gender" value="male" required> Male</label>
                            <label><input type="radio" name="gender" value="female"> Female</label>
                            <label><input type="radio" name="gender" value="other"> Other</label>
                        </div>
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Submit</button>
                    <button type="reset" class="btn-reset">Reset</button>
                </div>
            </form>
        </div>
    </main>
