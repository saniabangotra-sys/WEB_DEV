<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Gallery - GCET Jammu</title>

    <link rel="stylesheet" href="new css.css">

    <style>
        /* Gallery-specific styles */

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            text-align: center;
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .title-underline {
            width: 80px;
            height: 4px;
            background-color: #961a28;
            margin: 0 auto 35px;
            border-radius: 2px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .gallery-grid img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .gallery-grid img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
        }

        /* Tablet screens */
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .gallery-grid img {
                height: 200px;
            }

            .page-title {
                font-size: 28px;
            }
        }

        /* Mobile screens */
        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-grid img {
                height: 230px;
            }

            .gallery-container {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Header: matches the homepage -->
    <header>
        <img
            src="https://gcetj.ac.in/department.php?dept=humanities"
            alt="GCET Logo"

                <a href="link form to website.html" class="btn">
                    Login
                </a>

        </div>
    </header>

    <!-- Navigation: Gallery is the active page -->
    <nav>
        <ul>
            <li>

            </li>
            <li>

            </li>
            <li>

            </li>
            <li>
                <a href="Untitled-5.html">Students</a>
            </li>
            <li>

            </li>
            <li>
                <a href="Untitled-6.html">Admission</a>
            </li>

    <!-- Gallery content -->

                alt="College Campus"

            <img
                src="https://gcetj.ac.in/photos/college-building/1.JPG"
                alt="College Building"

            <img
                src="https://gcetj.ac.in/photos/college-building/2.JPG"
                alt="College Campus Building"

            <img
